name: ManageBac Timetable Sync

on:
  # Saturday 06:00 Asia/Shanghai = Friday 22:00 UTC (no DST in China)
  schedule:
    - cron: '0 22 * * 5'
  # Manual trigger for debugging
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: managebac-timetable
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Run sync
        env:
          MANAGEBAC_BASE_URL: ${{ vars.MANAGEBAC_BASE_URL || 'https://ycishk.managebac.com' }}
          MANAGEBAC_USERNAME: ${{ secrets.MANAGEBAC_USERNAME }}
          MANAGEBAC_PASSWORD: ${{ secrets.MANAGEBAC_PASSWORD }}
          MANAGEBAC_TIMETABLE_PATH: ${{ vars.MANAGEBAC_TIMETABLE_PATH || '/student/timetable' }}
          MANAGEBAC_WEEKS_AHEAD: ${{ vars.MANAGEBAC_WEEKS_AHEAD || '4' }}
          MANAGEBAC_TZ: ${{ vars.MANAGEBAC_TZ || 'Asia/Shanghai' }}
          ICS_CALNAME: ${{ vars.ICS_CALNAME || 'ManageBac Timetable' }}
          CLASS_EXCLUDE: ${{ vars.CLASS_EXCLUDE }}
          CLASS_INCLUDE: ${{ vars.CLASS_INCLUDE }}
          CYCLE_LENGTH: ${{ vars.CYCLE_LENGTH || '2' }}
          CYCLE_NAMES: ${{ vars.CYCLE_NAMES || 'A,B' }}
          CYCLE_ANCHOR_DATE: ${{ vars.CYCLE_ANCHOR_DATE || '2026-09-14' }}
          DEBUG: ${{ vars.DEBUG || '0' }}
          MANAGEBAC_ICAL_URL: ${{ secrets.MANAGEBAC_ICAL_URL }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          NOTIFY_SERVERCHAN_SENDKEY: ${{ secrets.NOTIFY_SERVERCHAN_SENDKEY }}
          NOTIFY_PUSHPLUS_TOKEN: ${{ secrets.NOTIFY_PUSHPLUS_TOKEN }}
          NOTIFY_WECHAT_WEBHOOK: ${{ secrets.NOTIFY_WECHAT_WEBHOOK }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
        run: python main.py

      - name: Upload debug dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: managebac-debug
          path: debug/
          if-no-files-found: ignore

      - name: Deploy to GitHub Pages (gh-pages branch)
        if: success()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          keep_files: false
          force_orphan: true
